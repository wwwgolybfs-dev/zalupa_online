# Конфиг для Cloudflare Worker Builds (авто-деплой из GitHub при пуше).
# Точка входа — воркер-мост в папке bridge/. Имя воркера совпадает с уже
# задеплоенным вручную, поэтому workers.dev-адрес не меняется.
name = "kto-ruina-bridge"
main = "bridge/worker.js"
compatibility_date = "2026-01-01"

# Секрет OPENDOTA_KEY уже задан в настройках воркера и не объявляется здесь —
# секреты хранятся отдельно от кода и переживают передеплой.
